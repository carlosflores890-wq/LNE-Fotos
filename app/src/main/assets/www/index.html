<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#03090f" />
<title>LNE Fotos</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <img alt="La Nueva Estación" class="brand" />
  <div><h1>LNE Fotos</h1><p>Resultados de partidos</p></div>
</header>
<main class="shell">
  <section class="controls card">
    <h2>Plantilla</h2>
    <div class="segmented" id="templateButtons">
      <button class="active" data-template="caballeros">Caballeros</button>
      <button data-template="damas">Damas</button>
      <button data-template="mixto">Mixto</button>
    </div>
    <div class="grid2">
      <label>Categoría<select id="category"><option>3ra</option><option>4ta</option><option>5ta</option><option>6ta</option><option selected>7ma</option><option>8va</option></select></label>
      <label>Instancia<select id="stage"><option>Zona</option><option>Cuartos</option><option>Semifinal</option><option selected>Final</option></select></label>
    </div>
    <h2>Foto</h2>
    <div class="actions">
      <label class="btn primary">📷 Sacar foto<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn">🖼️ Galería<input id="galleryInput" type="file" accept="image/*" hidden></label>
    </div>
    <label>Zoom<input type="range" id="zoom" min="1" max="2.8" step="0.01" value="1" /></label>
    <button id="resetPhoto" class="btn small" type="button">Recentrar foto</button>
    <p class="hint">Arrastrá la foto en la vista previa para acomodarla.</p>
    <h2>Partido</h2>
    <div class="grid2"><label>Pareja izquierda<input id="leftName" value="FLORES / SANTANA" /></label><label>Pareja derecha<input id="rightName" value="NIEVAS / GATICA" /></label></div>
    <div class="grid2"><label>Ganó<select id="winner"><option value="left" selected>Izquierda</option><option value="right">Derecha</option></select></label><label>Resultado<input id="score" value="6/7 · 6/4 · 6/3" /></label></div>
    <div class="actions bottom"><button id="saveBtn" class="btn primary" type="button">Guardar imagen</button><button id="shareBtn" class="btn" type="button">Compartir</button></div>
  </section>
  <section class="preview card"><div class="previewHead"><h2>Vista previa</h2><span>1080 × 1920</span></div><canvas id="poster" width="1080" height="1920"></canvas></section>
</main>
<footer>La Nueva Estación · App de resultados</footer>
<script src="assets/logo2_01.js"></script>
<script src="assets/logo2_02.js"></script>
<script src="assets/logo2_03.js"></script>
<script src="assets/logo2_04.js"></script>
<script src="assets/logo2_05.js"></script>
<script src="assets/logo2_06.js"></script>
<script src="assets/init.js"></script>
<script src="assets/sponsors_new_01.js"></script>
<script src="assets/sponsors_new_02.js"></script>
<script src="assets/sponsors_new_03.js"></script>
<script src="assets/sponsors_finalize.js"></script>
<script src="app.js"></script>
</body></html>
